/* ---------- anchored menu ---------- */
function MenuButton({ items, label, icon, size, kind }) {
  const [open, setOpen] = useState(null);
  const btn = useRef();
  const menu = useRef();
  useEscape(() => setOpen(null), !!open);
  useEffect(() => {
    if (!open) return;
    const close = (e) => { if (menu.current && !menu.current.contains(e.target) && !btn.current.contains(e.target)) setOpen(null); };
    const onScroll = () => setOpen(null);
    document.addEventListener('pointerdown', close); window.addEventListener('resize', onScroll);
    setTimeout(() => { const f = menu.current && menu.current.querySelector('button'); f && f.focus(); }, 10);
    return () => { document.removeEventListener('pointerdown', close); window.removeEventListener('resize', onScroll); };
  }, [open]);
  const toggle = (e) => {
    e.stopPropagation();
    if (open) return setOpen(null);
    const r = btn.current.getBoundingClientRect();
    const w = 220, hgt = items.length * 36 + 14;
    let left = Math.min(window.innerWidth - w - 8, Math.max(8, r.right - w));
    let top = r.bottom + 6; if (top + hgt > window.innerHeight - 8) top = Math.max(8, r.top - hgt - 6);
    setOpen({ left, top });
  };
  return html`<${Fragment}>
    <button ref=${btn} type="button" className=${cx('btn', kind || 'ghost', size || 'sm', !label && 'icon')} onClick=${toggle} aria-haspopup="menu" aria-expanded=${!!open} title=${label || 'More actions'} aria-label=${label || 'More actions'}>
      <${Icon} n=${icon || 'more'} />${label}${label && html`<${Icon} n="down" />`}</button>
    ${open && ReactDOM.createPortal(html`<div className="menu" ref=${menu} role="menu" style=${{ left: open.left, top: open.top, width: 220 }} onKeyDown=${(e) => {
      const bs = [...menu.current.querySelectorAll('button')]; const i = bs.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { e.preventDefault(); bs[(i + 1) % bs.length].focus(); }
      if (e.key === 'ArrowUp') { e.preventDefault(); bs[(i - 1 + bs.length) % bs.length].focus(); }
    }}>
      ${items.filter(Boolean).map((it, i) => it === '-' ? html`<div className="sep" key=${i} />` : html`<button key=${i} role="menuitem" className=${it.danger ? 'danger' : ''} onClick=${(e) => { e.stopPropagation(); setOpen(null); it.onClick(); }}><${Icon} n=${it.icon || 'right'} />${it.label}</button>`)}
    </div>`, document.body)}
  <//>`;
}

/* ---------- error boundary: a screen can fail, the app never blanks ---------- */
class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err) { try { track('Screen error', { where: this.props.where || 'unknown' }); } catch (e) {} }
  componentDidUpdate(prev) { if (prev.resetKey !== this.props.resetKey && this.state.err) this.setState({ err: null }); }
  render() {
    if (!this.state.err) return this.props.children;
    return html`<div className="card" style=${{ margin: 20 }}><${Empty} icon="alert" title="This screen hit a snag" action=${html`<${Btn} onClick=${() => { this.setState({ err: null }); go('#/dashboard'); }}>Back to dashboard<//><${Btn} kind="primary" icon="reset" onClick=${() => { Store.reset(); this.setState({ err: null }); go('#/dashboard'); }}>Reset demo<//>`}>
      Something you did here isn't handled gracefully yet — nothing is lost that matters, this is a demo. Head back, or reset to start fresh.<//></div>`;
  }
}

/* ---------- normalised document model (shared by PDF + paper render) ---------- */
function docModel(s, kind, rec, extra) {
  const co = s.company, cl = clientOf(s, rec.clientId);
  const m = { kind, number: rec.number, title: rec.title || '', company: co, client: cl, lines: rec.lines || [], notes: rec.notes || '' };
  if (kind === 'invoice') {
    const mm = invoiceMath(s, rec);
    Object.assign(m, { heading: 'INVOICE', totals: mm, discount: rec.discount, issued: rec.createdAt, due: rec.dueAt, paid: mm.paid, balance: mm.balance,
      payments: s.payments.filter((p) => p.invoiceId === rec.id).sort((a, b) => a.at - b.at), status: invoiceStatus(s, rec) });
  } else if (kind === 'estimate') {
    const t = calcDoc(rec.lines, 0, co.taxRate);
    Object.assign(m, { heading: 'ESTIMATE', totals: t, issued: rec.sentAt || rec.createdAt, validUntil: rec.validUntil, depositPct: rec.depositPct || 0, status: estimateStatus(rec) });
  } else if (kind === 'receipt') {
    const inv = byId(s, 'invoices', rec.invoiceId) || {};
    const mm = inv.id ? invoiceMath(s, inv) : { total: 0, balance: 0 };
    const before = s.payments.filter((p) => p.invoiceId === rec.invoiceId && p.at < rec.at).reduce((a, p) => a + p.amount, 0);
    Object.assign(m, { heading: 'RECEIPT', number: rec.receiptNo, title: 'Payment received — ' + (inv.number || ''), client: clientOf(s, inv.clientId), invoice: inv, payment: rec,
      invTotal: mm.total, remaining: Math.max(0, mm.total - before - rec.amount), lines: inv.lines || [] });
  } else if (kind === 'contract') {
    Object.assign(m, { heading: 'AGREEMENT', sections: contractSections(s, rec), contract: rec, issued: rec.sentAt || rec.createdAt });
  }
  return Object.assign(m, extra || {});
}

/* ---------- handwritten-style signature (seed records & countersignature) ---------- */
const _sigCache = {};
function scriptSignature(name, color) {
  const key = name + (color || '');
  if (_sigCache[key]) return _sigCache[key];
  try {
    const c = document.createElement('canvas'); c.width = 640; c.height = 180;
    const x = c.getContext('2d');
    x.fillStyle = color || '#1b2a4a';
    x.font = 'italic 64px "Snell Roundhand","Segoe Script","Brush Script MT","Apple Chancery","URW Chancery L",cursive';
    x.textBaseline = 'middle';
    x.save(); x.translate(20, 96); x.rotate(-0.04); x.fillText(name, 0, 0); x.restore();
    // a confident underline flourish
    x.strokeStyle = color || '#1b2a4a'; x.lineWidth = 2.4; x.lineCap = 'round';
    const w = Math.min(600, x.measureText(name).width + 30);
    x.beginPath(); x.moveTo(30, 140); x.bezierCurveTo(w * 0.35, 128, w * 0.7, 150, w, 132); x.stroke();
    return (_sigCache[key] = c.toDataURL('image/png'));
  } catch (e) { return null; }
}
const contractSigImage = (k) => (k.signature ? k.signature : k.signedAt ? scriptSignature(k.signerName || 'Signed') : null);

/* ---------- download action with visible failure (never silent) ---------- */
function usePdf() {
  const [state, set] = useState({ busy: false, err: null });
  const run = useCallback(async (model, mode) => {
    set({ busy: true, err: null });
    try {
      const blob = await buildPdf(model);
      if (mode === 'blob') { set({ busy: false, err: null }); return blob; }
      downloadBlob(blob, pdfName(model));
      track('PDF downloaded', { kind: model.kind });
      set({ busy: false, err: null });
      return blob;
    } catch (e) {
      set({ busy: false, err: e && e.message === 'timeout' ? 'The PDF engine took too long to load. Check the connection and try again.' : 'The PDF engine couldn\'t load (it comes from cdn.jsdelivr.net). Check the connection, or that a firewall isn\'t blocking it, and try again.' });
      return null;
    }
  }, []);
  return [state, run, () => set({ busy: false, err: null })];
}
function PdfButton({ model, label, size, kind }) {
  const [st, run, clear] = usePdf();
  return html`<${Fragment}><${Btn} kind=${kind} size=${size || 'sm'} icon="download" onClick=${() => run(model)} disabled=${st.busy}>${st.busy ? 'Building PDF…' : (label || 'PDF')}<//>
    ${st.err && ReactDOM.createPortal(html`<${Modal} size="narrow" title="Couldn't build the PDF" onClose=${clear} icon=${{ n: 'alert', tone: 'bad' }} foot=${html`<${Btn} kind="ghost" onClick=${clear}>Close<//><${Btn} kind="primary" onClick=${() => run(model)}>Try again<//>`}><p className="muted">${st.err}</p><//>`, document.body)}<//>`;
}

/* ===== actions.js ===== */
/* =============================================================================
   Actions — the business cycle. Every mutation of demo state goes through here.
   ============================================================================= */
const COMM_RANK = { sent: 1, delivered: 2, opened: 3, clicked: 4, received: 0 };
function bumpComm(id, status) {
  if (!id) return;
  patch('comms', id, (m) => (COMM_RANK[status] > (COMM_RANK[m.status] || 0) ? { status, fresh: true } : {}));
}
function addComm(o) {
  const rec = { id: uid('m'), at: Date.now(), status: 'sent', subject: '', kind: 'message', refId: null, fresh: true, demo: true, ...o };
  insert('comms', rec);
  if (rec.dir === 'out') setTimeout(() => bumpComm(rec.id, 'delivered'), 1400);
  return rec.id;
}
const _recent = {};
const debounced = (key, ms = 1200) => { const t = Date.now(); if (_recent[key] && t - _recent[key] < ms) return true; _recent[key] = t; return false; };

/* ---------- sending: nothing leaves the browser; we log it and open the client view ---------- */
function sendDoc(type, id, channel) {
  if (debounced('send:' + type + id + channel)) return;
  const s = Store.get(), now = Date.now();
  let commId = null, label = '';
  if (type === 'invoice') {
    const inv = byId(s, 'invoices', id); if (!inv) return;
    if (!inv.sentAt) patch('invoices', id, { sentAt: now });
    if (channel === 'sms') commId = addComm({ clientId: inv.clientId, channel: 'sms', dir: 'out', body: smsFor(s, 'pay', inv), kind: 'invoice', refId: id });
    else { const e = emailFor(s, 'invoice', inv); commId = addComm({ clientId: inv.clientId, channel: 'email', dir: 'out', subject: e.subject, body: `Invoice for ${inv.title} — ${money(invoiceMath(s, inv).balance)} due ${fmtDate(inv.dueAt)}.`, kind: 'invoice', refId: id }); }
    label = `${inv.number} ${channel === 'sms' ? 'payment link texted' : 'sent'} to ${clientOf(s, inv.clientId).name}`;
    logActivity('invoice', label, '#/invoices/' + id);
    Journey.milestone('invoice_sent');
  } else if (type === 'estimate') {
    const e0 = byId(s, 'estimates', id); if (!e0) return;
    if (!e0.sentAt) patch('estimates', id, { sentAt: now, validUntil: e0.validUntil && e0.validUntil > now ? e0.validUntil : now + 30 * DAY });
    const e = emailFor(s, 'estimate', e0);
    commId = addComm({ clientId: e0.clientId, channel: 'email', dir: 'out', subject: e.subject, body: `Estimate for ${e0.title} — ${money(calcDoc(e0.lines, 0, s.company.taxRate).total)}.`, kind: 'estimate', refId: id });
    // move the matching lead to "Estimate sent"
    const ld = s.leads.find((l) => l.clientId === e0.clientId && ['new', 'contacted', 'qualified'].includes(l.stage));
    if (ld) patch('leads', ld.id, (l) => ({ stage: 'estimate', timeline: [...l.timeline, { at: now, text: `Estimate ${e0.number} sent` }] }));
    Journey.milestone('estimate_sent');
    logActivity('estimate', `${e0.number} sent to ${clientOf(s, e0.clientId).name}`, '#/estimates/' + id);
  } else if (type === 'contract') {
    const k = byId(s, 'contracts', id); if (!k) return;
    if (!k.sentAt) patch('contracts', id, { sentAt: now });
    const e = emailFor(s, 'contract', k);
    commId = addComm({ clientId: k.clientId, channel: 'email', dir: 'out', subject: e.subject, body: `${k.title} sent for signature.`, kind: 'contract', refId: id });
    Journey.milestone('contract_sent');
    logActivity('contract', `${k.number} sent to ${clientOf(s, k.clientId).name} for signature`, '#/contracts/' + id);
  } else if (type === 'review') {
    const j = byId(s, 'jobs', id); if (!j) return;
    const rq = { id: uid('rq'), clientId: j.clientId, jobId: id, channel: channel || 'sms', at: now, status: 'sent', demo: true };
    insert('reviewRequests', rq);
    const body = channel === 'email' ? 'How did we do? Ten seconds, one tap.' : smsFor(s, 'review', j);
    commId = addComm({ clientId: j.clientId, channel: channel || 'sms', dir: 'out', subject: channel === 'email' ? emailFor(s, 'review', j).subject : '', body, kind: 'review', refId: rq.id });
    Journey.milestone('review_requested');
    logActivity('review', `Review request ${channel === 'email' ? 'emailed' : 'texted'} to ${clientOf(s, j.clientId).name}`, '#/reviews');
    track('Send', { type, channel: channel || 'sms' });
    CV.open({ type: 'review', id: rq.id, channel: channel || 'sms', mode: 'send', commId });
    return;
  }
  track('Send', { type, channel: channel || 'email' });
  CV.open({ type, id, channel: channel || 'email', mode: 'send', commId });
}
function sendText(clientId, template, body) {
  if (debounced('sms:' + clientId)) return;
  const s = Store.get();
  const cl = clientOf(s, clientId);
  const text = body && body.trim() ? body.trim() : smsFor(s, template, { clientId, id: clientId });
  const commId = addComm({ clientId, channel: 'sms', dir: 'out', body: text, kind: template || 'message' });
  logActivity('sms', `Text sent to ${cl.name}`, '#/comms/' + clientId);
  track('Send', { type: 'sms', template: template || 'custom' });
  CV.open({ type: 'sms', id: commId, mode: 'send', commId });
}

/* ---------- payments ---------- */
function recordPayment(invoiceId, amount, method, ref, opts) {
  const s = Store.get();
  const inv = byId(s, 'invoices', invoiceId);
  if (!inv) return { error: 'This invoice no longer exists.' };
  const m = invoiceMath(s, inv);
  if (!(amount > 0)) return { error: 'Enter an amount greater than $0.00.' };
  if (amount > m.balance) return { error: `That's more than the ${money(m.balance)} balance. Record ${money(m.balance)} or less.` };
  const n = s.payments.filter((p) => p.invoiceId === invoiceId).length + 1;
  const p = { id: uid('p'), invoiceId, amount, method, ref: ref || ({ card: 'Card', ach: 'ACH transfer', check: 'Check', cash: 'Cash' }[method] || method), at: Date.now(), receiptNo: 'RCT-' + inv.number.replace(/\D/g, '') + '-' + n, demo: true };
  insert('payments', p);
  if (!inv.sentAt) patch('invoices', invoiceId, { sentAt: Date.now() });
  const full = amount >= m.balance;
  logActivity('payment', `${clientOf(s, inv.clientId).name} ${full ? 'paid' : 'paid part of'} ${inv.number} — ${money(amount)}${full ? '' : ' (partial)'}`, '#/invoices/' + invoiceId);
  const e = emailFor(Store.get(), 'receipt', inv, { payment: p, invoice: inv });
  addComm({ clientId: inv.clientId, channel: 'email', dir: 'out', subject: e.subject, body: `Receipt ${p.receiptNo} for ${money(amount)}.`, kind: 'receipt', refId: p.id, auto: true });
  track('Payment recorded', { partial: !full, via: (opts && opts.via) || 'crm' });
  Journey.milestone(full ? 'invoice_paid' : 'partial_payment');
  return { payment: p, full };
}

/* ---------- estimates → jobs → invoices ---------- */
function acceptEstimate(id, via) {
  const s = Store.get(), e = byId(s, 'estimates', id); if (!e || e.status === 'accepted') return;
  patch('estimates', id, { status: 'accepted', acceptedAt: Date.now(), declinedAt: null, declineReason: null, sentAt: e.sentAt || Date.now() });
  const ld = s.leads.find((l) => l.clientId === e.clientId && l.stage !== 'won');
  if (ld) patch('leads', ld.id, (l) => ({ stage: 'won', timeline: [...l.timeline, { at: Date.now(), text: `Estimate ${e.number} accepted` }] }));
  logActivity('estimate', `${clientOf(s, e.clientId).name} accepted ${e.number}${via === 'client' ? ' online' : ''}`, '#/estimates/' + id);
  track('Estimate accepted', { via: via || 'crm' });
  Journey.milestone('estimate_accepted');
}
function declineEstimate(id, reason) {
  const s = Store.get(), e = byId(s, 'estimates', id); if (!e) return;
  patch('estimates', id, { status: 'declined', declinedAt: Date.now(), declineReason: reason || 'No reason given.' });
  const ld = s.leads.find((l) => l.clientId === e.clientId && l.stage !== 'lost' && l.stage !== 'won');
  if (ld) patch('leads', ld.id, (l) => ({ stage: 'lost', lostReason: reason || 'Estimate declined', timeline: [...l.timeline, { at: Date.now(), text: `Estimate ${e.number} declined` }] }));
  logActivity('estimate', `${e.number} marked declined — the lead moved to Lost`, '#/estimates/' + id);
}
function reopenEstimate(id) { patch('estimates', id, { status: 'sent', declinedAt: null, declineReason: null, acceptedAt: null }); }
function estimateToJob(id) {
  const s = Store.get(), e = byId(s, 'estimates', id); if (!e) return null;
  if (e.jobId && byId(s, 'jobs', e.jobId)) return e.jobId;
  if (e.status !== 'accepted') acceptEstimate(id);
  const j = { id: uid('j'), number: nextNumber(Store.get().jobs, 'JOB'), clientId: e.clientId, title: e.title, status: 'scheduled', scheduledAt: startOfDay(Date.now() + 2 * DAY) + 9 * 36e5, crewId: 'cr1', estimateId: id,
    value: calcDoc(e.lines, 0, s.company.taxRate).total, notes: '', demo: true,
    deliverables: [...e.lines.filter((l) => lineTotal(l) >= 0).map((l) => ({ id: uid('d'), text: l.desc, done: false })), { id: uid('d'), text: 'Final walkthrough with client', done: false }] };
  insert('jobs', j, true);
  patch('estimates', id, { jobId: j.id });
  logActivity('job', `${j.number} created from ${e.number} — scheduled ${fmtDay(j.scheduledAt)}`, '#/jobs/' + j.id);
  track('Converted', { from: 'estimate', to: 'job' });
  Journey.milestone('job_created');
  return j.id;
}
function jobToInvoice(jobId) {
  const s = Store.get(), j = byId(s, 'jobs', jobId); if (!j) return null;
  const existing = s.invoices.find((i) => i.jobId === jobId);
  if (existing) return existing.id;
  const e = j.estimateId ? byId(s, 'estimates', j.estimateId) : null;
  let lines = e ? e.lines.map((l) => ({ ...l, id: uid('li') })) : [{ id: uid('li'), desc: j.title, qty: 1, unit: fin(j.value), taxable: false }];
  // credit any paid deposit invoice for the same estimate
  const dep = e ? s.invoices.find((i) => i.estimateId === e.id && /deposit/i.test(i.title) && invoiceMath(s, i).paid > 0) : null;
  if (dep) lines.push({ id: uid('li'), desc: `Deposit received — ${dep.number}`, qty: 1, unit: -invoiceMath(s, dep).paid, taxable: false });
  const inv = { id: uid('i'), number: nextNumber(s.invoices, 'INV'), clientId: j.clientId, jobId, estimateId: e ? e.id : null, title: j.title, createdAt: Date.now(), dueAt: startOfDay(Date.now()) + (s.company.terms) * DAY, lines, discount: 0, notes: '', demo: true };
  insert('invoices', inv, true);
  logActivity('invoice', `${inv.number} drafted from ${j.number}${dep ? ' — deposit credited' : ''}`, '#/invoices/' + inv.id);
  track('Converted', { from: 'job', to: 'invoice' });
  Journey.milestone('invoice_drafted');
  return inv.id;
}
function completeJob(id) {
  const s = Store.get(), j = byId(s, 'jobs', id); if (!j) return;
  Journey.milestone('job_completed');
  patch('jobs', id, (x) => ({ status: 'completed', completedAt: Date.now(), deliverables: x.deliverables.map((d) => ({ ...d, done: true })) }));
  logActivity('job', `${j.number} completed for ${clientOf(s, j.clientId).name}`, '#/jobs/' + id);
}

/* ---------- leads ---------- */
function moveLead(id, stage) {
  const s = Store.get(), l = byId(s, 'leads', id); if (!l || l.stage === stage) return;
  const label = (STAGES.find((x) => x.key === stage) || {}).label || stage;
  patch('leads', id, (x) => ({ stage, timeline: [...x.timeline, { at: Date.now(), text: `Moved to ${label}` }] }));
  track('Lead moved', { to: stage });
}
function convertLead(id) {
  const s = Store.get(), l = byId(s, 'leads', id); if (!l) return null;
  if (l.clientId && byId(s, 'clients', l.clientId)) return l.clientId;
  const c = { id: uid('c'), type: l.company ? 'commercial' : 'residential', name: l.company || l.name, contact: l.name, email: l.email || '', phone: l.phone || '', address: l.address || '', city: l.city || '', state: 'NJ', zip: '',
    lat: l.lat, lng: l.lng, createdAt: Date.now(), tags: [l.source], notes: (l.notes || []).map((n) => n.text).join('\n'), demo: true };
  insert('clients', c, true);
  patch('leads', id, (x) => ({ clientId: c.id, stage: ['new', 'contacted'].includes(x.stage) ? 'qualified' : x.stage, timeline: [...x.timeline, { at: Date.now(), text: 'Converted to a client record' }] }));
  logActivity('lead', `${l.company || l.name} converted from lead to client`, '#/clients/' + c.id);
  track('Converted', { from: 'lead', to: 'client' });
  Journey.milestone('lead_converted');
  return c.id;
}

/* ---------- contracts & reviews (driven from the client-facing pages) ---------- */
function signContract(id, name, dataUrl) {

  const now = Date.now();

  const e = emailFor(Store.get(), 'contractSigned', byId(Store.get(), 'contracts', id));
  addComm({ clientId: k.clientId, channel: 'email', dir: 'out', subject: e.subject, body: 'Signed copy sent automatically with both signatures.', kind: 'contract', refId: id, auto: true });
  Journey.milestone('contract_signed');
  track('Contract signed', { device: matchMedia('(pointer:coarse)').matches ? 'touch' : 'mouse' });

}
function submitReview(rqId, rating, text, extra) {
  const s = Store.get(), rq = byId(s, 'reviewRequests', rqId); if (!rq) return null;
  const kind = rating >= 4 ? 'public' : 'private';
  const r = { id: uid('r'), clientId: rq.clientId, jobId: rq.jobId, kind, rating, text: text || '', at: Date.now(), demo: true, contactOk: extra && extra.contactOk, resolved: false };
  insert('reviews', r, true);

const CV = (() => {

    get: () => st, subscribe: (f) => { subs.add(f); return () => subs.delete(f); },
    open(o) { set({ open: { mode: 'preview', ...o }, nonce: st.nonce + 1 }); track('Client view opened', { type: o.type, mode: o.mode || 'preview', channel: o.channel || 'email' }); },
    close() { if (st.open) track('Client view closed', { type: st.open.type, step: st.lastStep || '' }); set({ open: null }); },

})();

function makeFallbackPad(canvas) {

      if (pad.current && pad.current.fromData && data) pad.current.fromData(data);
      if (pad.current && pad.current.restyle) pad.current.restyle();
    };
    size();
    const init = (useLib) => {
      if (!alive || !cv.current) return;
      if (useLib) pad.current = new window.SignaturePad(cv.current, { penColor: '#14213d', minWidth: 0.9, maxWidth: 2.8, velocityFilterWeight: 0.6 });
      else pad.current = makeFallbackPad(cv.current);
      pad.current.addEventListener('endStroke', () => { setEmpty(pad.current.isEmpty()); onChange(pad.current.isEmpty() ? null : pad.current); });
    };
    loadScript(CFG.CDN.signaturePad, () => window.SignaturePad, 8000).then(() => init(true)).catch(() => init(false));
    const ro = new ResizeObserver(() => size()); ro.observe(cv.current);
    return () => { alive = false; ro.disconnect(); if (pad.current) { pad.current.off && pad.current.off(); } };
  }, []);
  const clear = () => { if (pad.current) pad.current.clear(); setEmpty(true); onChange(null); };
  return html`<div className=${cx('sigpad-wrap', error && 'err')}>
    <canvas ref=${cv} aria-label="Signature pad — draw your signature" role="img" />
    <div className="base" /><span className="x">×</span>
    ${empty && html`<div className="ph">${isTouch() ? 'Sign here with your finger' : 'Sign here with your mouse or trackpad'}</div>`}
    ${!empty && html`<button type="button" className="clear" onClick=${clear}>Clear</button>`}
  </div>`;
}

/* ===== maps.js ===== */
/* =============================================================================
   Maps — Leaflet + OpenStreetMap tiles, styled dark. No API key involved.
   If the map library or tiles can't load, every map falls back to a styled
   address card (or a schematic pin view) — never a blank box or an error.
   ============================================================================= */
const MapsState = (() => {
  let st = { failed: false, reason: null };
  const subs = new Set();
  return { get: () => st, subscribe: (f) => { subs.add(f); return () => subs.delete(f); }, fail(reason) { if (st.failed) return; st = { failed: true, reason }; subs.forEach((f) => f()); track('Maps fallback', { reason }); } };
})();
const useMapsState = () => useSyncExternalStore(MapsState.subscribe, MapsState.get);
let _lf = null;
function loadMaps() {
  if (MapsState.get().failed) return Promise.reject(new Error(MapsState.get().reason));
  if (_lf) return _lf;
  if (!document.querySelector('link[data-leaflet]')) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = CFG.CDN.leafletCss; l.setAttribute('data-leaflet', '1'); l.crossOrigin = 'anonymous'; document.head.appendChild(l); }
  _lf = loadScript(CFG.CDN.leaflet, () => window.L && window.L.map).then(() => window.L).catch((e) => { MapsState.fail('lib'); _lf = null; throw e; });
  return _lf;
}
const TILES = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
function baseLayer(L, map) {
  const layer = L.tileLayer(TILES, { maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>', crossOrigin: true });
  let ok = 0, bad = 0;
  layer.on('tileload', () => { ok++; }); layer.on('tileerror', () => { bad++; if (bad >= 6 && ok === 0) MapsState.fail('tiles'); });
  layer.addTo(map);
  map.attributionControl.setPrefix(false);
  return layer;
}
const MAP_REASON = { lib: 'The map couldn\'t load right now, so here is the address.', tiles: 'Map tiles couldn\'t load right now, so here is the address.' };
const pinIcon = (L, label, cls) => L.divIcon({ className: 'lf-pin', html: `<div class="gpin ${cls || ''}"><div class="b">${esc(label)}</div><div class="t"></div></div>`, iconSize: [0, 0] });
const hasCoords = (o) => o && isFinite(o.lat) && isFinite(o.lng) && o.lat !== null;
const fullAddress = (c) => [c.address, c.city, [c.state, c.zip].filter(Boolean).join(' ')].filter(Boolean).join(', ');
const mapsLink = (c) => 'https://www.openstreetmap.org/search?query=' + encodeURIComponent(fullAddress(c));

/* ---------- placeholder with the address ---------- */
function MapPlaceholder({ c, reason, tall }) {
  return html`<div className=${cx('map', tall && 'tall')}><div className="map-ph"><div className="pin" /><div className="addr">${fullAddress(c) || 'No address on file'}</div>${reason && html`<div className="why">${MAP_REASON[reason] || ''}</div>`}
    ${fullAddress(c) && html`<a className="btn sm mt8" style=${{ position: 'relative', zIndex: 1 }} href=${mapsLink(c)} target="_blank" rel="noopener"><${Icon} n="external" />Open in a map</a>`}</div></div>`;
}

/* ---------- single-address map (client profile, job detail) ---------- */
function ClientMap({ c, tall }) {
  const ms = useMapsState();
  const ref = useRef();
  useEffect(() => {
    if (ms.failed || !hasCoords(c) || !ref.current) return;
    let alive = true, map = null;
    loadMaps().then((L) => {
      if (!alive || !ref.current) return;
      map = L.map(ref.current, { zoomControl: true, scrollWheelZoom: false, attributionControl: true }).setView([c.lat, c.lng], 16);
      baseLayer(L, map);
      L.marker([c.lat, c.lng], { icon: pinIcon(L, '●'), keyboard: false }).addTo(map);
    }).catch(() => {});
    return () => { alive = false; if (map) map.remove(); };
  }, [ms.failed, c.lat, c.lng]);
  if (ms.failed || !hasCoords(c)) return html`<${MapPlaceholder} c=${c} reason=${hasCoords(c) ? ms.reason : null} tall=${tall} />`;
  return html`<div className=${cx('map lf', tall && 'tall')} ref=${ref} role="img" aria-label=${'Map of ' + fullAddress(c)} />`;
}

/* ---------- many pins (jobs map, routes). Schematic fallback keeps pins clickable. ---------- */
function PinsMap({ pins, selected, onSelect, card, path, tall, legend }) {
  const ms = useMapsState();
  const ref = useRef(); const marks = useRef({});
  const valid = pins.filter(hasCoords);
  useEffect(() => {
    if (ms.failed || !ref.current || !valid.length) return;
    let alive = true, map = null;
    loadMaps().then((L) => {
      if (!alive || !ref.current) return;
      map = L.map(ref.current, { zoomControl: true, scrollWheelZoom: false });
      baseLayer(L, map);
      map.fitBounds(L.latLngBounds(valid.map((p) => [p.lat, p.lng])), { padding: [50, 50] });
      if (path) path.forEach((seg) => seg.points.length > 1 && L.polyline(seg.points.map((p) => [p.lat, p.lng]), { color: seg.color, weight: 3, opacity: 0.85, dashArray: '6 6' }).addTo(map));
      marks.current = {};
      valid.forEach((p) => { const m = L.marker([p.lat, p.lng], { icon: pinIcon(L, p.label, p.done ? 'done' : ''), title: p.title || p.label, riseOnHover: true }).addTo(map); m.on('click', (e) => { L.DomEvent.stopPropagation(e); onSelect(p.id); }); marks.current[p.id] = m; });
      map.on('click', () => onSelect(null));
    }).catch(() => {});
    return () => { alive = false; if (map) map.remove(); marks.current = {}; };
  }, [ms.failed, valid.map((p) => p.id + p.done).join()]);
  useEffect(() => { Object.entries(marks.current).forEach(([id, m]) => { const el = m.getElement && m.getElement(); const g = el && el.querySelector('.gpin'); if (g) g.classList.toggle('sel', id === selected); }); }, [selected]);
  if (!valid.length) return html`<div className=${cx('map', tall && 'tall')}><div className="map-ph"><div className="addr">Nothing to pin yet</div><div className="why">Jobs with an address appear here.</div></div></div>`;
  if (ms.failed) return html`<${SchematicPins} pins=${valid} selected=${selected} onSelect=${onSelect} card=${card} path=${path} tall=${tall} reason=${ms.reason} />`;
  return html`<div style=${{ position: 'relative' }}><div className=${cx('map lf', tall && 'tall')} ref=${ref} />${card && html`<div style=${{ position: 'absolute', left: 12, right: 12, bottom: 28, display: 'flex', justifyContent: 'center', pointerEvents: 'none', zIndex: 500 }}><div style=${{ pointerEvents: 'auto', width: '100%', maxWidth: 380 }}>${card}</div></div>`}${legend}</div>`;
}
function SchematicPins({ pins, selected, onSelect, card, path, tall, reason }) {
  const lats = pins.map((p) => p.lat), lngs = pins.map((p) => p.lng);
  const pad = 0.12, minLa = Math.min(...lats), maxLa = Math.max(...lats), minLn = Math.min(...lngs), maxLn = Math.max(...lngs);
  const spanLa = Math.max(maxLa - minLa, 0.01), spanLn = Math.max(maxLn - minLn, 0.01);
  const xy = (la, ln) => ({ x: (pad + (1 - 2 * pad) * (ln - minLn) / spanLn) * 100, y: (pad + (1 - 2 * pad) * (maxLa - la) / spanLa) * 100 });
  return html`<div style=${{ position: 'relative' }}><div className=${cx('map', tall && 'tall')} onClick=${() => onSelect(null)}>
    <div className="map-ph" style=${{ justifyContent: 'flex-start', alignItems: 'flex-start' }}><div className="why" style=${{ position: 'absolute', left: 14, top: 12, textAlign: 'left' }}>Schematic view · map tiles couldn't load right now</div></div>
    ${path && html`<svg viewBox="0 0 100 100" preserveAspectRatio="none" style=${{ position: 'absolute', inset: 0, width: '100%', height: '100%' }}>${path.map((seg, k) => html`<polyline key=${k} points=${seg.points.map((p) => { const q = xy(p.lat, p.lng); return q.x + ',' + q.y; }).join(' ')} fill="none" stroke=${seg.color} strokeWidth="0.5" strokeDasharray="1.4 1" vectorEffect="non-scaling-stroke" style=${{ strokeWidth: 2.5 }} />`)}</svg>`}
    ${pins.map((p) => { const q = xy(p.lat, p.lng); return html`<div key=${p.id} className=${cx('gpin', p.done && 'done', selected === p.id && 'sel')} style=${{ left: q.x + '%', top: q.y + '%' }} role="button" tabIndex="0" aria-label=${p.title || p.label} onClick=${(e) => { e.stopPropagation(); onSelect(p.id); }} onKeyDown=${(e) => e.key === 'Enter' && onSelect(p.id)}><div className="b">${p.label}</div><div className="t" /></div>`; })}
  </div>${card && html`<div style=${{ position: 'absolute', left: 12, right: 12, bottom: 12, display: 'flex', justifyContent: 'center' }}><div style=${{ width: '100%', maxWidth: 380 }}>${card}</div></div>`}</div>`;
}

/* ---------- Measure: draw a polygon, get area + perimeter ---------- */
const FT2_PER_M2 = 10.7639, FT_PER_M = 3.28084;
function geoMetrics(pts) {
  if (pts.length < 2) return { area: 0, perim: 0 };
  const lat0 = pts.reduce((a, p) => a + p.lat, 0) / pts.length, k = Math.cos(lat0 * Math.PI / 180);
  const xy = pts.map((p) => ({ x: p.lng * 111320 * k, y: p.lat * 110540 }));
  let a = 0, per = 0;
  for (let i = 0; i < xy.length; i++) { const p = xy[i], q = xy[(i + 1) % xy.length]; a += p.x * q.y - q.x * p.y; if (i < xy.length - 1 || pts.length > 2) per += Math.hypot(q.x - p.x, q.y - p.y); }
  return { area: pts.length > 2 ? Math.abs(a / 2) * FT2_PER_M2 : 0, perim: per * FT_PER_M };
}
function planMetrics(pts, unitsPerFt) {
  if (pts.length < 2) return { area: 0, perim: 0 };
  let a = 0, per = 0;
  for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; a += p.x * q.y - q.x * p.y; if (i < pts.length - 1 || pts.length > 2) per += Math.hypot(q.x - p.x, q.y - p.y); }
  return { area: pts.length > 2 ? Math.abs(a / 2) / (unitsPerFt * unitsPerFt) : 0, perim: per / unitsPerFt };
}
const fmtFt = (n) => Math.round(fin(n)).toLocaleString('en-US');
function MeasureTool({ c, onUse, useLabel }) {
  const ms = useMapsState();
  const [pts, setPts] = useState([]);
  const [closed, setClosed] = useState(false);
  const live = !ms.failed && hasCoords(c);
  const m = live ? geoMetrics(pts) : planMetrics(pts, 4);
  useEffect(() => { track('Measure opened', { live }); }, []);
  const undo = () => { if (closed) setClosed(false); else setPts(pts.slice(0, -1)); };
  const clear = () => { setPts([]); setClosed(false); };
  return html`<div className="col gap12">
    <div className="row wrap gap8">
      <span className="small muted grow" style=${{ minWidth: 220 }}>${closed ? 'Shape closed. ' + (live ? 'Drag a corner to adjust.' : '') : pts.length < 3 ? 'Click each corner of the area to measure.' : 'Keep clicking corners, then click the first point (or Close shape).'}</span>
      <${Btn} size="sm" icon="undo" onClick=${undo} disabled=${!pts.length}>Undo<//>
      <${Btn} size="sm" icon="x" onClick=${clear} disabled=${!pts.length}>Clear<//>
      <${Btn} size="sm" kind="primary" icon="check" onClick=${() => setClosed(true)} disabled=${pts.length < 3 || closed}>Close shape<//>
    </div>
    <div className="measure-note"><${Icon} n="info" /><span>In your build, this tool runs on <b>Google Maps satellite imagery</b> — you see the actual roofline, driveway and lot edges and trace them exactly. This public demo uses OpenStreetMap instead, so you're outlining street-map footprints rather than aerial photos. The measuring and the estimate it feeds work the same either way.</span></div>
    ${live ? html`<${MeasureMap} c=${c} pts=${pts} setPts=${setPts} closed=${closed} setClosed=${setClosed} />` : html`<${MeasurePlan} pts=${pts} setPts=${setPts} closed=${closed} setClosed=${setClosed} reason=${ms.reason} />`}
    <div className="grid g3">
      <div className="kpi" style=${{ cursor: 'default' }}><span className="label">Area</span><span className="value">${fmtFt(m.area)} <span className="small muted">sq ft</span></span><span className="foot">${(m.area / 43560).toFixed(3)} acres</span></div>
      <div className="kpi" style=${{ cursor: 'default' }}><span className="label">Perimeter</span><span className="value">${fmtFt(m.perim)} <span className="small muted">ft</span></span><span className="foot">${plural(pts.length, 'corner')}</span></div>
      <div className="kpi" style=${{ cursor: 'default', justifyContent: 'center' }}>${onUse ? html`<${Btn} kind="primary" icon="plus" disabled=${!(closed && m.area > 0)} onClick=${() => onUse({ area: Math.round(m.area), perim: Math.round(m.perim) })}>${useLabel || 'Add to estimate'}<//><span className="foot">${closed ? 'Adds the measurement as a line item' : 'Close the shape first'}</span>` : html`<span className="foot">Measurements feed straight into estimates.</span>`}</div>
    </div></div>`;
}
function MeasureMap({ c, pts, setPts, closed, setClosed }) {
  const ref = useRef(); const g$ = useRef({});
  useEffect(() => {
    let alive = true, map = null;
    loadMaps().then((L) => {
      if (!alive || !ref.current) return;
      map = L.map(ref.current, { zoomControl: true, scrollWheelZoom: true, doubleClickZoom: false, maxZoom: 19 }).setView([c.lat, c.lng], 19);
      baseLayer(L, map);
      const poly = L.polygon([], { color: '#a9c2ff', weight: 2.5, fillColor: '#7ea4ff', fillOpacity: 0.25 }).addTo(map);
      const line = L.polyline([], { color: '#a9c2ff', weight: 2.5, dashArray: '6 6' }).addTo(map);
      g$.current = { L, map, poly, line, layer: L.layerGroup().addTo(map) };
      map.on('click', (e) => { if (g$.current.closed) return; setPts((p) => [...p, { lat: e.latlng.lat, lng: e.latlng.lng }]); });
      ref.current.style.cursor = 'crosshair';
    }).catch(() => {});
    return () => { alive = false; if (map) map.remove(); g$.current = {}; };
  }, []);
  useEffect(() => {
    const { L, poly, line, layer } = g$.current; if (!L) return;
    g$.current.closed = closed; layer.clearLayers();
    const ll = pts.map((p) => [p.lat, p.lng]);
    poly.setLatLngs(closed || pts.length > 2 ? ll : []); line.setLatLngs(closed ? [] : ll);
    pts.forEach((p, i) => {
      const first = i === 0 && pts.length > 2 && !closed;
      const m = L.marker([p.lat, p.lng], { draggable: closed, icon: L.divIcon({ className: 'lf-vtx', html: `<span class="vtx ${i === 0 ? 'first' : ''} ${first ? 'closable' : ''}"></span>`, iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(layer);
      if (first) m.on('click', (e) => { L.DomEvent.stopPropagation(e); setClosed(true); });
      if (closed) m.on('drag', (e) => { const q = e.target.getLatLng(); const nx = pts.slice(); nx[i] = { lat: q.lat, lng: q.lng }; poly.setLatLngs(nx.map((x) => [x.lat, x.lng])); }).on('dragend', (e) => { const q = e.target.getLatLng(); setPts((cur) => cur.map((x, k) => (k === i ? { lat: q.lat, lng: q.lng } : x))); });
    });
  }, [pts, closed]);
  return html`<div className="map lf measure" ref=${ref} style=${{ height: 'min(56vh,460px)' }} role="application" aria-label="Map — click each corner of the area to measure" />`;
}
const hasCoordsFallback = (reason) => (reason ? 'the live map couldn\'t load right now — the measuring works the same' : 'this client has no map location yet — the measuring works the same');
function MeasurePlan({ pts, setPts, closed, setClosed, reason }) {
  const ref = useRef();
  const add = (e) => {
    if (closed) return;
    const svg = ref.current, r = svg.getBoundingClientRect();
    const p = { x: (e.clientX - r.left) / r.width * 800, y: (e.clientY - r.top) / r.height * 500 };
    if (pts.length > 2 && Math.hypot(p.x - pts[0].x, p.y - pts[0].y) < 14) { setClosed(true); return; }
    setPts([...pts, p]);
  };
  const ptsStr = pts.map((p) => p.x + ',' + p.y).join(' ');
  return html`<div style=${{ position: 'relative' }}>
    <svg ref=${ref} viewBox="0 0 800 500" onClick=${add} style=${{ width: '100%', height: 'auto', display: 'block', borderRadius: 16, border: '1px solid var(--line)', cursor: closed ? 'default' : 'crosshair', background: '#1b2a1f', touchAction: 'manipulation' }} role="application" aria-label="Sample property plan — click corners to measure">
      <defs><pattern id="grass" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#1d3022"/><path d="M0 16 16 0" stroke="#22382a" strokeWidth="1"/></pattern></defs>
      <rect width="800" height="500" fill="url(#grass)"/>
      <rect x="0" y="430" width="800" height="70" fill="#2a2d33"/><path d="M0 465h800" stroke="#e6c44a" strokeWidth="2" strokeDasharray="18 14" opacity=".7"/>
      <rect x="60" y="40" width="680" height="380" fill="none" stroke="#c9d1c3" strokeWidth="1.5" strokeDasharray="6 6" opacity=".55"/>
      <rect x="250" y="120" width="230" height="160" rx="4" fill="#59606b"/><path d="M250 200h230M365 120v160" stroke="#4a5059" strokeWidth="2"/>
      <rect x="480" y="190" width="90" height="90" fill="#4c535d"/><rect x="505" y="280" width="50" height="150" fill="#3a3e45"/>
      <rect x="140" y="300" width="80" height="60" rx="6" fill="#2d5a73" opacity=".85"/>
      ${[[120, 100, 34], [640, 90, 40], [680, 330, 30], [180, 210, 26], [600, 380, 22]].map(([x, y, r], i) => html`<circle key=${i} cx=${x} cy=${y} r=${r} fill="#2c5233" stroke="#24452b" strokeWidth="3"/>`)}
      <text x="70" y="34" fill="#c9d1c3" fontSize="12" opacity=".7">Sample lot · 170 × 95 ft</text>
      <g transform="translate(620,30)"><path d="M0 0h100" stroke="#fff" strokeWidth="2"/><path d="M0 -5v10M100 -5v10" stroke="#fff" strokeWidth="2"/><text x="50" y="18" fill="#fff" fontSize="11" textAnchor="middle">25 ft</text></g>
      ${pts.length > 2 && html`<polygon points=${ptsStr} fill="rgba(126,164,255,.25)" stroke="none"/>`}
      ${pts.length > 1 && html`<polyline points=${ptsStr + (closed ? ' ' + pts[0].x + ',' + pts[0].y : '')} fill="none" stroke="#a9c2ff" strokeWidth="2.5"/>`}
      ${pts.map((p, i) => html`<circle key=${i} cx=${p.x} cy=${p.y} r=${i === 0 && pts.length > 2 && !closed ? 8 : 5.5} fill=${i === 0 ? '#4fdc9f' : '#7ea4ff'} stroke="#fff" strokeWidth="2"/>`)}
    </svg>
    <div className="faint tiny" style=${{ position: 'absolute', left: 12, bottom: 10, background: 'rgba(0,0,0,.55)', padding: '4px 8px', borderRadius: 8 }}>Sample plan · ${hasCoordsFallback(reason)}</div>
  </div>`;
}

const FormHost = (() => {
  let st = null; const subs = new Set();
  return { get: () => st, subscribe: (f) => { subs.add(f); return () => subs.delete(f); }, open(name, props) { st = { name, props: props || {}, k: Date.now() }; subs.forEach((f) => f()); track('Form opened', { form: name }); }, close() { st = null; subs.forEach((f) => f()); } };
})();
const openForm = (n, p) => FormHost.open(n, p);
function FormsHost() {
  const f = useSyncExternalStore(FormHost.subscribe, FormHost.get);
  if (!f) return null;
  const C = { estimate: DocForm, invoice: DocForm, payment: PaymentForm, lead: LeadForm, client: ClientForm, job: JobForm, contract: ContractForm, text: TextForm, measure: MeasureForm, decline: DeclineForm }[f.name];

const isEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v || '').trim());

function ClientSelect({ value, onChange, error }) {
  const s = useStore();
  const list = [...s.clients].sort((a, b) => a.name.localeCompare(b.name));

const CATALOG = [
  ['Site assessment & scope', 15000, false], ['Standard service visit', 38500, false], ['Labor — technician (per hour)', 9500, false], ['Labor — crew of two (per hour)', 16500, false],
  ['Materials & supplies', 10000, true], ['Replacement parts', 4750, true], ['Equipment rental — lift (day)', 22500, true], ['Haul-away & disposal', 12500, false],
  ['After-hours call-out', 22500, false], ['Preventive maintenance visit', 59500, false], ['Final walkthrough & sign-off', 0, false],
];
const blankLine = () => ({ id: uid('li'), desc: '', qty: '1', unit: '', taxable: false });
function LineItemsEditor({ lines, setLines, errors, onMeasure, allowCredit, taxRate }) {
  const upd = (id, k, v) => setLines(lines.map((l) => (l.id === id ? { ...l, [k]: v } : l)));
  const toCents = (l) => Math.round(fin(parseQty(l.qty)) * fin(parseMoney(l.unit)));

    <div className="li-grid head"><span>Description</span><span className="right">Qty</span><span className="right">Rate</span><span className="hm">Tax</span><span className="right hm">Amount</span><span /></div>

      <div className="li-grid">

        <input className=${cx('input right', errors && errors['q' + i] && 'err')} value=${l.qty} inputMode="decimal" aria-label="Quantity" onInput=${(e) => upd(l.id, 'qty', e.target.value)} />
        <input className=${cx('input right', errors && errors['u' + i] && 'err')} value=${l.unit} inputMode="decimal" placeholder="0.00" aria-label="Rate" onInput=${(e) => upd(l.id, 'unit', e.target.value)} />
        <label className="check hm" title="Taxable"><input type="checkbox" checked=${!!l.taxable} onChange=${(e) => upd(l.id, 'taxable', e.target.checked)} /></label>
        <span className="right tnum hm">${money(toCents(l))}</span>
        <${Btn} kind="ghost" size="sm" icon="trash" title="Remove line" onClick=${() => setLines(lines.length > 1 ? lines.filter((x) => x.id !== l.id) : [blankLine()])} />
      </div>
      ${errors && (errors['d' + i] || errors['q' + i] || errors['u' + i]) && html`<div className="err-text mt4"><${Icon} n="alert" />${errors['d' + i] || errors['q' + i] || errors['u' + i]}</div>`}
    </div>`)}
    <datalist id="ocs-catalog">${CATALOG.map((c) => html`<option key=${c[0]} value=${c[0]} />`)}</datalist>
    <div className="row wrap gap6 mt4">

      ${onMeasure && html`<${Btn} size="sm" icon="map" onClick=${onMeasure}>Measure a property<//>`}
      ${allowCredit && html`<${Btn} size="sm" icon="receipt" onClick=${() => setLines([...lines, { id: uid('li'), desc: 'Deposit received', qty: '1', unit: '-0.00', taxable: false }])}>Add deposit credit<//>`}

}
const toEditLines = (lines) => (lines && lines.length ? lines.map((l) => ({ ...l, qty: String(fin(l.qty)), unit: (fin(l.unit) / 100).toFixed(2) })) : [blankLine()]);
function validateLines(lines, allowNegative) {
  const er = {}; const out = [];
  lines.forEach((l, i) => {
    const blank = !l.desc.trim() && !String(l.unit).trim();
    if (blank && lines.length > 1) return;
    const q = parseQty(l.qty), u = parseMoney(l.unit);
    if (!l.desc.trim()) er['d' + i] = 'Add a description.';
    else if (!(q > 0)) er['q' + i] = 'Quantity must be more than zero.';
    else if (!isFinite(u)) er['u' + i] = 'Enter a rate, like 125.00.';
    else if (u < 0 && !allowNegative) er['u' + i] = 'Rates can\'t be negative here.';
    else if (Math.abs(u) > 100000000) er['u' + i] = 'That rate is too large for a demo.';
    out.push({ id: l.id || uid('li'), desc: l.desc.trim(), qty: q, unit: u, taxable: !!l.taxable && u > 0 });
  });
  if (!out.length) er.lines = 'Add at least one line item.';
  return [er, out];
}

/* ---------- Estimate / Invoice ---------- */
function DocForm({ kind, id, clientId, onClose, prefillLine, jobId }) {
  const s = useStore();
  const rec = id ? byId(s, kind === 'estimate' ? 'estimates' : 'invoices', id) : null;
  const [f, setF] = useState(() => ({
    clientId: rec ? rec.clientId : clientId || '', title: rec ? rec.title : '',
    days: rec ? String(Math.max(1, dayDiff(kind === 'estimate' ? rec.validUntil : rec.dueAt))) : String(kind === 'estimate' ? 30 : s.company.terms),
    deposit: rec && rec.depositPct ? String(rec.depositPct) : '0', discount: rec && rec.discount ? (rec.discount / 100).toFixed(2) : '', notes: rec ? rec.notes : '',
    jobId: rec ? rec.jobId || '' : jobId || '',
  }));
  const [lines, setLines] = useState(() => (rec ? toEditLines(rec.lines) : prefillLine ? [prefillLine] : [blankLine()]));
  const [errs, setErrs] = useState({});
  const [measuring, setMeasuring] = useState(false);
  const set = (k) => (e) => setF({ ...f, [k]: e && e.target ? e.target.value : e });
  const preview = (() => { const [, ls] = validateLines(lines, kind === 'invoice'); return calcDoc(ls, kind === 'invoice' ? parseMoney(f.discount) || 0 : 0, s.company.taxRate); })();
  const save = (andSend) => {
    const er = {};
    if (!f.clientId || !byId(s, 'clients', f.clientId)) er.clientId = 'Choose who this is for.';
    if (!f.title.trim()) er.title = 'Give it a short title — it appears on the email and PDF.';
    const d = parseInt(f.days, 10); if (!(d >= 0 && d <= 365)) er.days = 'Enter a number of days between 0 and 365.';
    const [le, ls] = validateLines(lines, kind === 'invoice'); Object.assign(er, le);
    const dep = parseInt(f.deposit, 10); if (kind === 'estimate' && !(dep >= 0 && dep <= 100)) er.deposit = 'Deposit is a percentage from 0 to 100.';
    const disc = f.discount ? parseMoney(f.discount) : 0; if (kind === 'invoice' && !(disc >= 0)) er.discount = 'Discount must be a positive amount.';
    const tot = calcDoc(ls, disc, s.company.taxRate);
    if (!Object.keys(er).length && kind === 'invoice' && tot.subtotal - tot.discount + tot.tax < tot.credits) er.lines = 'Credits are larger than the work billed — reduce the deposit credit.';
    setErrs(er);
    if (Object.keys(er).length) return;
    const now = Date.now();
    if (kind === 'estimate') {
      const data = { clientId: f.clientId, title: f.title.trim(), validUntil: startOfDay(now) + d * DAY + 17 * 36e5, depositPct: dep || 0, lines: ls, notes: f.notes.trim() };
      if (rec) { patch('estimates', rec.id, data); UI.toast(`${rec.number} updated`); onClose(); if (andSend) sendDoc('estimate', rec.id); return; }
      const e = { id: uid('e'), number: nextNumber(s.estimates, 'EST'), createdAt: now, status: 'draft', demo: true, ...data };
      insert('estimates', e, true); logActivity('estimate', `${e.number} created for ${clientOf(s, e.clientId).name}`, '#/estimates/' + e.id);
      onClose(); go('#/estimates/' + e.id); if (andSend) setTimeout(() => sendDoc('estimate', e.id), 60); else UI.toast(`${e.number} saved as a draft`);
    } else {
      const data = { clientId: f.clientId, title: f.title.trim(), dueAt: startOfDay(now) + d * DAY, lines: ls, discount: disc, notes: f.notes.trim(), jobId: f.jobId || null };
      if (rec) { patch('invoices', rec.id, data); UI.toast(`${rec.number} updated`); onClose(); if (andSend) sendDoc('invoice', rec.id); return; }
      const inv = { id: uid('i'), number: nextNumber(s.invoices, 'INV'), createdAt: now, demo: true, ...data };
      insert('invoices', inv, true); logActivity('invoice', `${inv.number} created for ${clientOf(s, inv.clientId).name}`, '#/invoices/' + inv.id);
      onClose(); go('#/invoices/' + inv.id); if (andSend) setTimeout(() => sendDoc('invoice', inv.id), 60); else UI.toast(`${inv.number} saved as a draft`);
    }
  };
  const label = kind === 'estimate' ? 'estimate' : 'invoice';
  const cl = byId(s, 'clients', f.clientId);
  if (measuring) return html`<${Modal} size="wide" title="Measure a property" sub=${cl ? fullAddress(cl) : 'Choose a client first to measure their address.'} onClose=${() => setMeasuring(false)}>
      <${MeasureTool} c=${cl || {}} onUse=${({ area, perim }) => { setLines([...lines.filter((l) => l.desc.trim() || String(l.unit).trim()), { id: uid('li'), desc: `Measured area — ${fmtFt(area)} sq ft (perimeter ${fmtFt(perim)} ft)`, qty: String(area), unit: '0.15', taxable: false }]); setMeasuring(false); }} /><//>`;
  return html`<${Modal} size="wide" title=${rec ? `Edit ${rec.number}` : `New ${label}`} onClose=${onClose}
    foot=${html`<span className="muted small grow">Total <b className="tnum" style=${{ color: 'var(--text)' }}>${money(preview.total)}</b></span><${Btn} kind="ghost" onClick=${onClose}>Cancel<//><${Btn} onClick=${() => save(false)}>Save draft<//><${Btn} kind="primary" icon="send" onClick=${() => save(true)}>Save & send<//>`}>
    <div className="form-grid">
      <${Field} label="Client" error=${errs.clientId}><${ClientSelect} value=${f.clientId} onChange=${(v) => setF({ ...f, clientId: v })} error=${errs.clientId} /><//>
      <${Field} label="Title" error=${errs.title}><input className=${cx('input', errs.title && 'err')} value=${f.title} onInput=${set('title')} placeholder=${kind === 'estimate' ? 'e.g. Seasonal service package' : 'e.g. Standard service visit'} /><//>
      <${Field} label=${kind === 'estimate' ? 'Valid for (days)' : 'Due in (days)'} error=${errs.days}><input className=${cx('input', errs.days && 'err')} value=${f.days} inputMode="numeric" onInput=${set('days')} /><//>
      ${kind === 'estimate' ? html`<${Field} label="Deposit on acceptance (%)" error=${errs.deposit} hint="Credited against the final invoice"><input className=${cx('input', errs.deposit && 'err')} value=${f.deposit} inputMode="numeric" onInput=${set('deposit')} /><//>`
        : html`<${Field} label="Discount ($)" error=${errs.discount}><input className=${cx('input', errs.discount && 'err')} value=${f.discount} inputMode="decimal" placeholder="0.00" onInput=${set('discount')} /><//>`}
      <div className="full"><div className="label mb8">Line items</div><${LineItemsEditor} lines=${lines} setLines=${setLines} errors=${errs} allowCredit=${kind === 'invoice'} onMeasure=${() => setMeasuring(true)} />${errs.lines && html`<div className="err-text mt8"><${Icon} n="alert" />${errs.lines}</div>`}</div>
      <div className="full totals"><span className="muted">Subtotal</span><span className="right tnum">${money(preview.subtotal)}</span>${preview.discount > 0 && html`<span className="muted">Discount</span><span className="right tnum">−${money(preview.discount)}</span>`}<span className="muted">Tax (${(s.company.taxRate * 100).toFixed(3)}%)</span><span className="right tnum">${money(preview.tax)}</span>${preview.credits > 0 && html`<span className="muted">Credits</span><span className="right tnum">−${money(preview.credits)}</span>`}<span className="grand">Total</span><span className="grand right tnum">${money(preview.total)}</span></div>
      <${Field} label="Notes (shown on the PDF)" full><textarea className="input" value=${f.notes} onInput=${set('notes')} placeholder="Optional" /><//>

/* ===== pulse.js ===== */
/* =============================================================================
   Business Pulse — interface. Recomputes from live state on every change.
   ============================================================================= */
const PulseOpts = (() => {
  let st = { simulateNew: false, open: false, busy: null }; const subs = new Set();
  const set = (p) => { st = { ...st, ...p }; subs.forEach((f) => f()); };
  return { get: () => st, subscribe: (f) => { subs.add(f); return () => subs.delete(f); }, set };
})();
const usePulseOpts = () => useSyncExternalStore(PulseOpts.subscribe, PulseOpts.get);
function usePulse() {
  const s = useStore(); const o = usePulseOpts();
  return useMemo(() => { try { return PulseEngine.compute(s, { simulateNew: o.simulateNew }); } catch (e) { return null; } }, [s, o.simulateNew]);
}
const PULSE_TONE = { ok: '#4fdc9f', mid: '#cfe06b', warn: '#f6bd54', bad: '#ff7c7c' };
const scoreColor = (sc) => (sc == null ? 'rgba(255,255,255,.22)' : sc >= 80 ? PULSE_TONE.ok : sc >= 70 ? PULSE_TONE.mid : sc >= 55 ? PULSE_TONE.warn : PULSE_TONE.bad);

/* tween a number toward its target so changes are impossible to miss */
function useTween(target, ms = 900) {
  const [v, setV] = useState(target);
  const from = useRef(target);
  useEffect(() => {
    if (target == null) { setV(null); from.current = null; return; }
    const a = from.current == null ? target : from.current, t0 = performance.now(); let raf;
    const step = (t) => { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); const x = a + (target - a) * e; setV(x); if (k < 1) raf = requestAnimationFrame(step); else from.current = target; };
    raf = requestAnimationFrame(step);
    return () => { cancelAnimationFrame(raf); from.current = target; };
  }, [target]);
  return v;
}
/* remembers recommendations that just got resolved, so they visibly resolve */
const RecTracker = (() => {
  let prev = null, resolved = [], gen = 0; const subs = new Set();
  return {
    update(p, scenarioKey) {
      if (!p || p.establishing) { prev = null; return; }
      const keys = new Map(p.recs.map((r) => [r.key, r]));
      if (prev && prev.scen === scenarioKey) prev.recs.forEach((r) => { if (!keys.has(r.key) && !resolved.some((x) => x.key === r.key)) { resolved = [...resolved, { ...r, at: Date.now() }]; gen++; subs.forEach((f) => f()); setTimeout(() => { resolved = resolved.filter((x) => x.key !== r.key); gen++; subs.forEach((f) => f()); }, 9000); } });
      prev = { recs: p.recs, scen: scenarioKey };
    },
    get: () => gen, list: () => resolved, subscribe: (f) => { subs.add(f); return () => subs.delete(f); }, clear() { resolved = []; prev = null; gen++; subs.forEach((f) => f()); },
  };
})();
function useResolved() { useSyncExternalStore(RecTracker.subscribe, RecTracker.get); return RecTracker.list(); }

/* ---------- the instrument ---------- */
function PulseGauge({ p, size = 220 }) {
  const sc = p && !p.establishing ? p.score : null;
  const v = useTween(sc);
  const r = size / 2 - 14, c = size / 2, start = 135, sweep = 270;
  const pt = (ang, rad) => [c + rad * Math.cos(ang * Math.PI / 180), c + rad * Math.sin(ang * Math.PI / 180)];
  const arc = (a0, a1, rad) => { const [x0, y0] = pt(a0, rad), [x1, y1] = pt(a1, rad); return `M${x0},${y0} A${rad},${rad} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1},${y1}`; };
  const col = scoreColor(v == null ? null : Math.round(v));
  const ri = r - 15;
  const seg = sweep / 6;
  return html`<div className="pulse-gauge" style=${{ width: size, height: size }}>
    <svg width=${size} height=${size} viewBox=${`0 0 ${size} ${size}`} aria-hidden="true">
      <defs><filter id="pglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" /></filter></defs>
      ${Array.from({ length: 28 }, (_, i) => { const a = start + i * sweep / 27, [x0, y0] = pt(a, r + 9), [x1, y1] = pt(a, r + (i % 9 === 0 ? 3 : 6)); return html`<line key=${i} x1=${x0} y1=${y0} x2=${x1} y2=${y1} stroke="rgba(255,255,255,.16)" strokeWidth=${i % 9 === 0 ? 1.6 : 1} />`; })}
      <path d=${arc(start, start + sweep, r)} fill="none" stroke="rgba(255,255,255,.07)" strokeWidth="10" strokeLinecap="round" strokeDasharray=${p && p.establishing ? '2 7' : null} />

function extendPulseHistory(st, days) {
  // after a time skip, fill the skipped days so the history line stays continuous
  const h = (st.pulseHistory || []).slice();
  const last = h[h.length - 1];
  const live = PulseEngine.compute({ ...st, pulseHistory: h }, {});
  const end = live.score == null ? (last ? last.score : 60) : live.score;
  const T0 = startOfDay(Date.now());
  for (let d = days; d >= 1; d--) {
    const at = T0 - d * DAY; if (last && at <= last.at) continue;
    const k = (days - d + 1) / days;
    h.push({ at, score: Math.round((last ? last.score : end) + (end - (last ? last.score : end)) * k), override: live.overrides.length && k > 0.5 ? live.overrides[0].key : null });
  }
  return { ...st, pulseHistory: h.slice(-365) };
}

  }, [p && p.score]);

/* ---------- full report: history + override timeline ---------- */
function PulseHistoryChart({ s, p }) {
  const [tip, setTip] = useState(null);
  const hist = (s.pulseHistory || []).slice(-90);
  const pts = [...hist, ...(p && !p.establishing ? [{ at: Date.now(), score: p.score, override: p.overrides.length ? p.overrides[0].key : null, live: true }] : [])];
  if (pts.length < 2) return html`<p className="muted">History builds one snapshot a day.</p>`;
  const W = 760, H = 240, pl = 34, pr = 10, pt = 10, pb = 24;
  const x = (i) => pl + (W - pl - pr) * i / (pts.length - 1), y = (v) => pt + (H - pt - pb) * (1 - v / 100);
  const bands = [[90, 100, PULSE_TONE.ok], [80, 90, PULSE_TONE.ok], [70, 80, PULSE_TONE.mid], [55, 70, PULSE_TONE.warn], [0, 55, PULSE_TONE.bad]];
  const line = pts.map((q, i) => `${i ? 'L' : 'M'}${x(i)},${y(q.score)}`).join(' ');
  return html`<div style=${{ position: 'relative' }}><svg className="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Pulse score history">
    ${bands.map(([a, b2, c], i) => html`<rect key=${i} x=${pl} width=${W - pl - pr} y=${y(b2)} height=${y(a) - y(b2)} fill=${c} opacity=".045" />`)}
    ${[55, 70, 80, 90].map((v) => html`<g key=${v}><line x1=${pl} x2=${W - pr} y1=${y(v)} y2=${y(v)} stroke="rgba(255,255,255,.07)" strokeDasharray="3 4" /><text x=${pl - 6} y=${y(v) + 4} textAnchor="end">${v}</text></g>`)}
    ${pts.map((q, i) => q.override && html`<rect key=${'o' + i} x=${x(i) - (W - pl - pr) / pts.length / 2} y=${pt} width=${(W - pl - pr) / pts.length + 0.5} height=${H - pt - pb} fill=${PULSE_TONE.bad} opacity=".13" />`)}
    <path d=${line} fill="none" stroke="#a9c2ff" strokeWidth="2" />
    ${pts.map((q, i) => html`<g key=${i} onMouseEnter=${() => setTip(i)} onMouseLeave=${() => setTip(null)}><rect x=${x(i) - 5} y=${pt} width="10" height=${H - pt - pb} fill="transparent" />${(q.override || q.live || tip === i) && html`<circle cx=${x(i)} cy=${y(q.score)} r=${q.live ? 5 : 3.2} fill=${q.override ? PULSE_TONE.bad : q.live ? scoreColor(q.score) : '#a9c2ff'} />`}</g>`)}
    ${[0, Math.floor(pts.length / 2), pts.length - 1].map((i) => html`<text key=${'t' + i} x=${x(i)} y=${H - 6} textAnchor=${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}>${pts[i].live ? 'Now' : fmtShort(pts[i].at)}</text>`)}
  </svg>${tip != null && html`<div className="charttip" style=${{ left: (x(tip) / W * 100) + '%', top: (y(pts[tip].score) / H * 100) + '%' }}><b>${pts[tip].live ? 'Now' : fmtDate(pts[tip].at)}</b><br/>Score ${pts[tip].score}${pts[tip].override ? html`<br/><span className="bad">Override active</span>` : ''}</div>`}</div>`;
}
const OVR_NAMES = { od: 'Severe overdue receivables', mrr: 'Rapid recurring revenue loss', st: 'Delivery stall' };
function overrideEvents(s, p) {
  const h = [...(s.pulseHistory || [])]; const ev = []; let cur = null;
  h.forEach((q) => { if (q.override && (!cur || cur.key !== q.override)) { cur = { key: q.override, from: q.at, to: q.at, low: q.score }; ev.push(cur); } else if (q.override && cur) { cur.to = q.at; cur.low = Math.min(cur.low, q.score); } else cur = null; });
  if (p && p.overrides.length) p.overrides.forEach((o) => { const open = ev.find((e) => e.key === o.key && Date.now() - e.to < 2 * DAY); if (open) { open.to = Date.now(); open.active = true; } else ev.push({ key: o.key, from: Date.now(), to: Date.now(), active: true, low: p.score }); });
  return ev.reverse();
}
function PulseReport() {
  const s = useStore(); const p = usePulse();
  useEffect(() => { track('Pulse report viewed', {}); }, []);
  const ev = overrideEvents(s, p);
  return html`<div className="col gap16">
    <div className="card"><div className="card-head"><${Icon} n="reports" /><h3>Score history · last 90 days</h3><span className="spacer" /><span className="legend"><span><i style=${{ background: '#a9c2ff' }} />Daily score</span><span><i style=${{ background: PULSE_TONE.bad, opacity: .6 }} />Override active</span></span></div><div className="card-body"><${PulseHistoryChart} s=${s} p=${p} /></div></div>
    <div className="card"><div className="card-head"><${Icon} n="alert" /><h3>Critical override timeline</h3></div>
      <div className="card-body">${ev.length ? html`<div className="timeline">${ev.map((e, i) => html`<div key=${i} className="tl-item"><b>${OVR_NAMES[e.key]}</b> ${e.active ? html`<${Badge} tone="bad">Active now<//>` : html`<${Badge} tone="ok">Cleared<//>`}<div className="when">${fmtDate(e.from)}${e.to - e.from > DAY ? ' – ' + (e.active ? 'now' : fmtDate(e.to)) : ''} · score held at or below ${e.low}</div></div>`)}</div>` : html`<p className="muted small">No overrides have fired in this period.</p>`}</div></div>

}

  const stTone = { sent: 'accent', delivered: 'info', opened: 'violet', clicked: 'ok', received: '' };
  const openAsClient = (m) => {

  const send = () => { if (!t) return; if (draft.trim().length < 2) return setErr('Write a message first.'); sendText(t.c.id, 'custom', draft); setDraft(''); setErr(null); };

/* ---------------------------------------------------------------- REPORTS */
function revenueEvents(s) { return [...s.ledger.invoices.map((x) => ({ at: x.at, amount: x.amount, clientId: x.clientId, source: x.source })), ...s.payments.map((p) => { const inv = byId(s, 'invoices', p.invoiceId); return { at: p.at, amount: p.amount, clientId: inv ? inv.clientId : null, source: null }; })]; }
function leadEvents(s) { return [...s.ledger.leads, ...s.leads.map((l) => ({ at: l.createdAt, source: l.source, won: l.stage === 'won', lost: l.stage === 'lost', value: fin(l.value), live: true }))]; }
function BarChart({ data, fmt, color, h = 220, line }) {
  const [tip, setTip] = useState(null);
  const W = 640, H = h, pl = 46, pb = 26, pt = 10;
  const max = Math.max(1, ...data.map((d) => d.v), ...(line ? data.map((d) => d.l * (line.scale || 1)) : [0]));
  const nice = Math.pow(10, Math.floor(Math.log10(max))); const top = Math.ceil(max / nice) * nice;
  const bw = (W - pl - 8) / data.length;
  const y = (v) => pt + (H - pt - pb) * (1 - v / top);
  return html`<div style=${{ position: 'relative' }}><svg className="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Chart">
    <g className="grid">${[0, .25, .5, .75, 1].map((k) => html`<g key=${k}><line x1=${pl} x2=${W} y1=${y(top * k)} y2=${y(top * k)} /><text x=${pl - 8} y=${y(top * k) + 4} textAnchor="end">${fmt(top * k)}</text></g>`)}</g>
    ${data.map((d, i) => html`<g key=${i} onMouseEnter=${() => setTip(i)} onMouseLeave=${() => setTip(null)}><rect x=${pl + i * bw + bw * 0.18} y=${y(d.v)} width=${bw * 0.64} height=${Math.max(0, H - pb - y(d.v))} rx="4" fill=${color || '#7ea4ff'} opacity=${tip === null || tip === i ? 0.92 : 0.45} /><rect x=${pl + i * bw} y=${pt} width=${bw} height=${H - pt - pb} fill="transparent" /><text x=${pl + i * bw + bw / 2} y=${H - 8} textAnchor="middle">${d.k}</text></g>`)}
    ${line && html`<polyline points=${data.map((d, i) => `${pl + i * bw + bw / 2},${y(d.l * (line.scale || 1))}`).join(' ')} fill="none" stroke=${line.color} strokeWidth="2" />${data.map((d, i) => html`<circle key=${'c' + i} cx=${pl + i * bw + bw / 2} cy=${y(d.l * (line.scale || 1))} r="3" fill=${line.color} />`)}`}
  </svg>${tip !== null && html`<div className="charttip" style=${{ left: ((pl + tip * bw + bw / 2) / W * 100) + '%', top: (y(data[tip].v) / H * 100) + '%' }}><b>${data[tip].label || data[tip].k}</b><br/>${fmt(data[tip].v)}${line ? html`<br/><span style=${{ color: line.color }}>${line.name}: ${data[tip].l}</span>` : ''}</div>`}</div>`;
}
