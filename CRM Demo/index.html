  const submit = async () => {
    const er = {};
    if (f.name.trim().length < 2) er.name = 'Your name, please.';
    if (f.business.trim().length < 2) er.business = 'What\'s the business called?';
    if (f.phone.replace(/\D/g, '').length < 10) er.phone = 'A 10-digit phone number, so we can reach you.';
    if (!isEmail(f.email)) er.email = 'That email doesn\'t look right.';
    if (!f.state) er.state = 'Pick your state.';
    if (!f.industry) er.industry = 'Pick the closest fit.';
    setErrs(er);
    if (Object.keys(er).length) { track('Book a call invalid', { fields: Object.keys(er).join(',') }); return; }
    const w = phase === 'form' && hasCal ? window.open(calUrl(), '_blank', 'noopener') : null;
    if (phase === 'form' && hasCal && !w) setPB(true);
    setPhase('sending'); setPostErr(null);
    const ok = await post();
    if (ok === 'unconfigured') { setPhase('form-retry'); setPostErr('This form isn\'t connected to an inbox yet. Please email us directly while we finish setting it up.'); track('Book a call post failed', { reason: 'unconfigured' }); return; }
    if (ok === 'rate') { setPhase('form-retry'); setPostErr('We received a request from you moments ago. If that was this one, you\'re all set. Otherwise wait a minute and press Send again.'); track('Book a call post failed', { reason: 'rate_limited' }); return; }
    if (!ok) { setPhase('form-retry'); setPostErr('Your details didn\'t reach us — the connection may have dropped. Press Send again' + (hasCal ? '; your calendar tab is already open.' : '.')); track('Book a call post failed', {}); return; }
    setPhase('done'); track('Book a call submitted', { industry: f.industry, state: f.state, where: b.where, with_note: f.note ? 'yes' : 'no' }); Journey.milestone('book_call_submitted');
  };
  if (b.collapsed) return html`<button className="btn primary lg" style=${{ position: 'fixed', right: 20, bottom: 'calc(20px + env(safe-area-inset-bottom))', zIndex: 140, boxShadow: '0 20px 40px -10px rgba(0,0,0,.8)' }} onClick=${() => BookCall.collapse(false)} aria-label="Expand Book a call with OCS"><img src=${ASSET.iconLight} alt="" style=${{ height: 22, width: 'auto' }} />Book a call with OCS · continue<//>`;
  return html`<div className="overlay drawer-wrap" style=${{ zIndex: 140 }} onMouseDown=${(e) => { if (e.target === e.currentTarget) BookCall.collapse(true); }}>
    <aside className="drawer" ref=${panel} role="dialog" aria-modal="true" aria-label="Book a call with OCS" style=${{ width: 'min(480px,100vw)' }}>
      <div className="modal-head" style=${{ borderBottom: '1px solid var(--line)' }}><img src=${ASSET.iconLight} alt="" style=${{ height: 34, width: 'auto' }} /><div className="grow"><h2>Book a call with OCS</h2><p className="muted small mt4">20 minutes with Optimized Company Systems — the team that built this demo. We'll talk about how your business actually runs.</p></div>
        <${Btn} kind="ghost" size="sm" icon="down" title="Collapse — your answers are kept" onClick=${() => BookCall.collapse(true)} /><${Btn} kind="ghost" size="sm" icon="x" title="Close (Esc)" onClick=${closeIt} /></div>
      ${phase === 'done' ? html`<div className="modal-body" style=${{ flex: 1 }}><div className="empty"><div className="glyph" style=${{ color: 'var(--ok)' }}><${Icon} n="check" cls="lg" /></div><h3>Thanks, ${f.name.trim().split(' ')[0]}</h3>
          <p>${!hasCal ? 'Your request is in. We\'ll reach out within one business day to find a time that suits you — and we\'ll come prepared with what you looked at here.' : popupBlocked ? 'Your browser blocked the calendar tab — open it below to pick a time.' : 'Pick a time in the calendar tab that just opened. We\'ll come prepared with what you looked at here.'}</p>
          <div className="row gap8 mt8">${hasCal && html`<a className="btn primary" href=${calUrl()} target="_blank" rel="noopener"><${Icon} n="calendar" />Open the calendar<//>`}<${Btn} onClick=${BookCall.close}>Back to the demo<//></div></div></div>`
      : html`<div className="modal-body" style=${{ flex: 1, paddingTop: 16 }}><div className="form-grid">
          <${Field} label="Name" error=${errs.name}><input className=${cx('input', errs.name && 'err')} value=${f.name} onInput=${set('name')} maxLength="120" autoComplete="name" data-autofocus /><//>
          <${Field} label="Business" error=${errs.business}><input className=${cx('input', errs.business && 'err')} value=${f.business} onInput=${set('business')} maxLength="160" autoComplete="organization" /><//>
          <${Field} label="Phone" error=${errs.phone}><input className=${cx('input', errs.phone && 'err')} value=${f.phone} onInput=${set('phone')} maxLength="40" inputMode="tel" autoComplete="tel" /><//>
          <${Field} label="Email" error=${errs.email}><input className=${cx('input', errs.email && 'err')} value=${f.email} onInput=${set('email')} maxLength="254" inputMode="email" autoComplete="email" /><//>
          <${Field} label="State" error=${errs.state} full><select className=${cx('input', errs.state && 'err')} value=${f.state} onChange=${set('state')} autoComplete="address-level1"><option value="">Choose…</option>${US_STATES.map((x) => html`<option key=${x} value=${x}>${x}</option>`)}</select><//>
          <${Field} label="Industry" error=${errs.industry} full><div className="row wrap gap6" role="radiogroup" aria-label="Industry">${INDUSTRIES.map((x) => html`<button key=${x} type="button" role="radio" aria-checked=${f.industry === x} className=${cx('chip', f.industry === x && 'on')} onClick=${() => set('industry')(x)}>${x}<//>`)}</div><//>
          <input type="text" name="company_website" tabIndex="-1" autoComplete="off" aria-hidden="true" value=${f.hp} onInput=${(e) => setF({ ...f, hp: e.target.value })} style=${{ position: 'absolute', left: -9999, width: 1, height: 1, opacity: 0 }} />
          <${Field} label="What should your CRM do that it doesn't today? (optional)" full><textarea className="input" rows="3" value=${f.note} onInput=${set('note')} maxLength="2000" /><//>
        </div>${postErr && html`<div className="mt16"><${Notice} tone="bad" title="Not sent yet">${postErr}<//></div>`}
        <p className="faint tiny mt16">Your details go only to Optimized Company Systems, along with a summary of which parts of this demo you explored, so the call can start where you're most interested. Nothing else you did here is stored.</p></div>
        <div className="modal-foot"><${Btn} kind="ghost" onClick=${() => BookCall.collapse(true)}>Later<//><${Btn} kind="primary" icon="calCheck" onClick=${submit} disabled=${phase === 'sending'}>${phase === 'sending' ? 'Sending…' : phase === 'form-retry' ? 'Send again' : hasCal ? 'Send & pick a time' : 'Request a call'}<//></div>`}
    </aside></div>`;
}

/* ---------- Layout ---------- */
const NAV = [
  { items: [['dashboard', 'Dashboard', 'dashboard']] },
  { group: 'Sales', items: [['leads', 'Leads', 'leads'], ['clients', 'Clients', 'clients'], ['estimates', 'Estimates', 'estimate'], ['contracts', 'Contracts', 'contract']] },
  { group: 'Operations', items: [['jobs', 'Jobs', 'jobs'], ['invoices', 'Invoices', 'invoice']] },
  { group: 'Relationships', items: [['reviews', 'Review funnel', 'star'], ['comms', 'Communications', 'comms']] },
  { group: 'Insights', items: [['reports', 'Reports', 'reports'], ['settings', 'Settings', 'settings']] },
];
const TITLES = Object.fromEntries([...NAV.flatMap((g) => g.items.map((i) => [i[0], i[1]])), ...TIER2.map((t) => ['t2/' + t[0], t[1]])]);
async function resetDemo() {
  if (!(await UI.confirm({ title: 'Reset the demo?', body: 'Everything you\'ve added, sent, signed or deleted is wiped and the original sample data comes back. This is the only way back — nothing is saved anywhere.', ok: 'Reset', icon: 'reset' }))) return;
  (Store.get().files || []).forEach((f) => { try { URL.revokeObjectURL(f.url); } catch (e) {} });
  CV.close(); FormHost.close(); Store.reset(); go('#/dashboard'); window.scrollTo(0, 0);
  UI.toast('Fresh demo data loaded'); track('Reset', {});
}
function NavLinks({ cur, onPick }) {
  const s = useStore(); const now = Date.now();
  const counts = { leads: s.leads.filter((l) => l.stage === 'new').length, invoices: s.invoices.filter((i) => invoiceStatus(s, i, now).overdue).length };
  const link = ([k, label, icon]) => html`<a key=${k} href=${'#/' + k} className=${cur === k || cur.startsWith(k + '/') ? 'active' : ''} onClick=${onPick} aria-current=${cur === k ? 'page' : undefined}><${Icon} n=${icon} />${label}${k === 'reviews' ? html`<span className="spark">Try it</span>` : counts[k] ? html`<span className="count">${counts[k]}</span>` : null}</a>`;
  return html`<${Fragment}>${NAV.map((g, n) => html`<div key=${n}>${g.group && html`<div className="nav-label">${g.group}</div>`}${g.items.map(link)}</div>`)}
    <div className="nav-label" style=${{ color: 'var(--violet)' }}><${Icon} n="sparkle" style=${{ width: 12, height: 12 }} />Built to your workflow</div>
    ${TIER2.map(([k, label, icon]) => link(['t2/' + k, label, icon]))}<//>`;
}
function Sidebar({ cur }) {
  const s = useStore();
  return html`<aside className="side" aria-label="Main navigation">
    <div className="brand"><div className="brand-mark"><${OcsMark} size=${28} /></div><div><div className="brand-name">${s.company.name}</div><div className="brand-sub">Live demo workspace</div></div></div>
    <nav className="nav" data-tour="nav"><${NavLinks} cur=${cur} /></nav>
    <div className="side-foot"><div className="powered"><a href=${CFG.POWERED_BY_URL} target="_blank" rel="noopener" onClick=${() => track('Powered by clicked', {})}>Powered by Optimized Company Systems</a></div></div>
  </aside>`;
}
function MoreSheet({ cur, onClose }) {
  return html`<${Modal} title="Everything" onClose=${onClose}><nav className="nav" style=${{ padding: 0 }}><${NavLinks} cur=${cur} onPick=${onClose} /></nav>
    <div className="powered mt16">Powered by <a href=${CFG.POWERED_BY_URL} target="_blank" rel="noopener">Optimized Company Systems</a></div><//>`;
}
function TopBar({ cur }) {
  const s = useStore();
  const title = TITLES[cur] || TITLES[cur.split('/')[0]] || 'Demo';
  return html`<header className="topbar">
    <div className="mob-brand"><div className="brand-mark" style=${{ width: 28, height: 28 }}><${OcsMark} size=${24} /></div><b style=${{ fontSize: 14 }}>${s.company.name}</b></div>
    <div className="crumbs"><span>${s.company.name}</span><${Icon} n="right" cls="faint" /><b>${title}</b></div>
    <span className="spacer" />
    <div className="row gap4" data-tour="help">
      <${MenuButton} kind="ghost" size="" icon="help" items=${[{ label: 'Replay the intro tour', icon: 'sparkle', onClick: () => { go('#/dashboard'); setTimeout(() => Coach.tour(), 250); } }, { label: 'Show tips for this screen', icon: 'help', onClick: () => Coach.tips(screenKey(Router.get().parts), true) }, { label: Coach.tipsOff() ? 'Turn screen tips on' : 'Turn screen tips off', icon: 'x', onClick: () => Coach.setTips(Coach.tipsOff()) }]} />
      <${Btn} kind="ghost" icon="reset" title="Reset the demo" onClick=${resetDemo}><span className="hide-m">Reset</span><//></div>
  </header>`;
}
function TabBar({ cur, onMore }) {
  const t = (k, label, icon) => html`<a href=${'#/' + k} className=${cur === k || cur.startsWith(k + '/') ? 'active' : ''}><${Icon} n=${icon} />${label}</a>`;
  return html`<nav className="tabbar" aria-label="Main" data-tour="nav">${t('dashboard', 'Home', 'dashboard')}${t('leads', 'Leads', 'leads')}${t('jobs', 'Jobs', 'jobs')}${t('invoices', 'Invoices', 'invoice')}<button onClick=${onMore}><${Icon} n="menu" />More</button></nav>`;
}
function OcsBanner({ notice, onCloseNotice }) {
  return html`<div className="ocs-banner" role="region" aria-label="About this demo">
    ${notice && html`<div className="ob-notice"><span className="dot" /><span><b>Live demo</b> · nothing you do is saved or sent · <a href="#" onClick=${(e) => { e.preventDefault(); resetDemo(); }}>Reset</a> any time</span><button className="btn ghost xs icon" onClick=${onCloseNotice} aria-label="Hide this notice" title="Hide this notice"><${Icon} n="x" /></button></div>`}
    <button type="button" className="ob-cta" data-tour="book" onClick=${() => bookCall('banner')}><img src=${ASSET.iconLight} alt="" /><span className="ob-long">Want a CRM like this, built around how <i>your</i> business runs?</span><b>Book a call with OCS</b><${Icon} n="arrowR" /></button>
  </div>`;
}

/* ---------- Router ---------- */
function Screen({ r }) {
  const [a, b] = r.parts;
  switch (a) {
    case 'dashboard': return html`<${Dashboard} />`;
    case 'leads': return html`<${Leads} id=${b} />`;
    case 'clients': return b ? html`<${ClientProfile} id=${b} />` : html`<${Clients} />`;
    case 'estimates': return b ? html`<${EstimateDetail} id=${b} />` : html`<${Estimates} />`;
    case 'invoices': return b ? html`<${InvoiceDetail} id=${b} />` : html`<${Invoices} query=${r.query} />`;
    case 'jobs': return b ? html`<${JobDetail} id=${b} />` : html`<${Jobs} query=${r.query} />`;
    case 'contracts': return b ? html`<${ContractDetail} id=${b} query=${r.query} />` : html`<${Contracts} />`;
    case 'reviews': return html`<${Reviews} query=${r.query} />`;
    case 'comms': return html`<${Comms} clientId=${b} />`;
    case 'reports': return html`<${Reports} query=${r.query} />`;
    case 'settings': return html`<${Settings} />`;
    case 't2': { const t = TIER2.find((x) => x[0] === b); if (t) return h(t[3]); break; }
  }
  return html`<div className="card"><${Empty} icon="search" title="Nothing lives at this address" action=${html`<${Btn} kind="primary" onClick=${() => go('#/dashboard')}>Go to the dashboard<//>`}>It may be an old link. Everything in the demo is reachable from the menu.<//></div>`;
}
function App() {
  const r = useRoute();
  const [banner, setBanner] = useState(sessionFlag.get('ocs.banner') !== 'off');
  const [more, setMore] = useState(false);
  const cur = r.parts.slice(0, r.parts[0] === 't2' ? 2 : 1).join('/');
  const skey = screenKey(r.parts);
  useEffect(() => {
    Analytics.pageview(r.raw || 'dashboard');
    Journey.screen(r.parts[0] === 't2' ? 't2/' + r.parts[1] : r.parts[0] + (r.parts[1] && !['comms'].includes(r.parts[0]) ? '/detail' : ''));
  }, [r.raw]);
  useEffect(() => { if (!(r.parts[0] === 'leads' && r.parts[1]) && !(r.parts[0] === 'comms')) window.scrollTo(0, 0); }, [cur, r.parts[1]]);
  // per-screen tips, after the intro tour, when nothing else is open
  useEffect(() => {
    if (['sign', 'review'].includes(r.parts[0])) return;
    const t = setTimeout(() => {
      if (Coach.get().active || CV.get().open || FormHost.get() || BookCall.get().open || !sessionFlag.get('ocs.tourDone')) return;
      Coach.tips(skey);
    }, 900);
    return () => clearTimeout(t);
  }, [skey]);
  if (r.parts[0] === 'sign') return html`<${ErrorBoundary} where="sign" resetKey=${r.raw}><${SignPage} id=${r.parts[1]} /><${UIHost} /><//>`;
  if (r.parts[0] === 'review') return html`<${ErrorBoundary} where="review" resetKey=${r.raw}><${ReviewPage} id=${r.parts[1]} /><${UIHost} /><//>`;
  return html`<${Fragment}>
    <${OcsBanner} notice=${banner} onCloseNotice=${() => { setBanner(false); sessionFlag.set('ocs.banner', 'off'); track('Banner dismissed', {}); }} />
    <div className="app">
      <${Sidebar} cur=${cur} />
      <div className="main"><${TopBar} cur=${cur} />
        <main className="content" id="main"><${ErrorBoundary} where=${skey} resetKey=${r.raw}><${Screen} r=${r} /><//></main></div>
    </div>
    <${TabBar} cur=${cur} onMore=${() => setMore(true)} />
    ${more && html`<${MoreSheet} cur=${cur} onClose=${() => setMore(false)} />`}
    <${FormsHost} /><${PulseHost} /><${ClientViewHost} /><${BookCallPanel} /><${CoachHost} /><${UIHost} />
  <//>`;
}

/* ---------- Boot ---------- */
(function boot() {
  const root = document.getElementById('root');
  try {
    Store.set(normalizeSeed(window.buildSeed(Date.now())));
    window.addEventListener('ocs:intro-done', (e) => track('Intro', { action: (e.detail && e.detail.how) || 'done' }), { once: true });
    window.addEventListener('error', (e) => { try { track('JS error', { msg: String(e.message || '').slice(0, 80) }); } catch (x) {} });
    const start = () => {
      ReactDOM.createRoot(root).render(h(App));
      document.documentElement.classList.add('app-ready');
      const startTour = () => { if (!sessionFlag.get('ocs.tourDone') && !/^#\/(sign|review)\//.test(location.hash)) setTimeout(() => Coach.tour(), 450); };
      if (window.__ocsIntroDone) startTour(); else window.addEventListener('ocs:intro-done', startTour, { once: true });
    };
    requestAnimationFrame(() => setTimeout(start, 0));
  } catch (e) {
    root.innerHTML = '<div style="padding:40px;text-align:center;color:#a9b0bd;font-family:-apple-system,sans-serif"><h2 style="color:#fff">The demo couldn\'t start</h2><p>Please refresh the page. If it keeps happening, your browser may be very old.</p></div>';
  }
})();

</script>
</body>
</html>
